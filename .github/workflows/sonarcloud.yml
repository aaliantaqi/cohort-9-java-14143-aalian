name: SonarCloud Analysis
on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
permissions:
  contents: read
  pull-requests: read
jobs:
  sonarcloud:
    if: github.repository == 'aaliantaqi/cohort-9-java-14143-aalian'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and test backend
        working-directory: "Contact Management System"
        run: mvn -B verify
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=aaliantaqi_cohort-9-java-14143-aalian
            -Dsonar.organization=aaliantaqi
            "-Dsonar.sources=Contact Management System/src/main/java,contact-management-frontend/src"
            "-Dsonar.exclusions=contact-management-frontend/node_modules/**,contact-management-frontend/dist/*"
            "-Dsonar.java.binaries=Contact Management System/target/classes"
            "-Dsonar.coverage.jacoco.xmlReportPaths=Contact Management System/target/site/jacoco/jacoco.xml"
